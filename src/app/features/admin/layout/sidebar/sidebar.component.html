<!-- src/app/features/admin/layout/sidebar/sidebar.component.html -->
<aside class="sidebar" [class.sidebar--collapsed]="collapsed">

  <!-- Logo -->
  <div class="sidebar__logo">
    <span class="sidebar__logo-icon">✦</span>
    @if (!collapsed) {
      <span class="sidebar__logo-text">EliteNest</span>
    }
    <button class="sidebar__toggle" (click)="toggleCollapse.emit()" [title]="collapsed ? 'Expand' : 'Collapse'">
      {{ collapsed ? '›' : '‹' }}
    </button>
  </div>

  <!-- Admin info -->
  @if (!collapsed) {
    <div class="sidebar__user">
      <div class="sidebar__user-avatar">
        {{ auth.admin()?.name?.charAt(0) || 'A' }}
      </div>
      <div class="sidebar__user-info">
        <span class="sidebar__user-name">{{ auth.admin()?.name }}</span>
        <span class="sidebar__user-role">{{ auth.admin()?.role }}</span>
      </div>
    </div>
  }

  <!-- Divider -->
  <div class="sidebar__divider"></div>

  <!-- Nav -->
  <nav class="sidebar__nav">
    @for (item of navItems; track item.route) {
      <a
        class="sidebar__nav-item"
        [routerLink]="item.route"
        routerLinkActive="sidebar__nav-item--active"
        [title]="collapsed ? item.label : ''"
      >
        <span class="sidebar__nav-icon">{{ item.icon }}</span>
        @if (!collapsed) {
          <span class="sidebar__nav-label">{{ item.label }}</span>
          @if (item.badge) {
            <span class="sidebar__nav-badge">{{ item.badge }}</span>
          }
        }
      </a>
    }
  </nav>

  <!-- Logout -->
  <div class="sidebar__footer">
    <div class="sidebar__divider"></div>
    <button class="sidebar__logout" (click)="auth.logout()">
      <span class="sidebar__nav-icon">⏻</span>
      @if (!collapsed) {
        <span>Logout</span>
      }
    </button>
  </div>

</aside>
