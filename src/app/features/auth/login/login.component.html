<!-- src/app/features/auth/login/login.component.html -->
<div class="login-page">

  <!-- Background decoration -->
  <div class="login-page__bg">
    <div class="login-page__orb login-page__orb--1"></div>
    <div class="login-page__orb login-page__orb--2"></div>
    <div class="login-page__grid"></div>
  </div>

  <div class="login-card">

    <!-- Logo -->
    <div class="login-card__logo">
      <span class="login-card__logo-icon">✦</span>
      <span class="login-card__logo-text">EliteNest</span>
    </div>

    <h1 class="login-card__title">Admin Portal</h1>
    <p class="login-card__subtitle">Sign in to manage your workspace</p>

    <!-- Error Message -->
    @if (error()) {
      <div class="login-card__error">
        <span>⚠</span> {{ error() }}
      </div>
    }

    <!-- Form -->
    <form class="login-form" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="form-input-wrap">
          <span class="form-input-icon">✉</span>
          <input
            class="form-input"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="admin@elitenest.com"
            autocomplete="email"
            [disabled]="loading()"
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="form-input-wrap">
          <span class="form-input-icon">⬤</span>
          <input
            class="form-input"
            [type]="showPass() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            [disabled]="loading()"
          />
          <button
            type="button"
            class="form-input-toggle"
            (click)="showPass.set(!showPass())"
          >
            {{ showPass() ? '👁' : '🙈' }}
          </button>
        </div>
      </div>

      <button class="btn-login" type="submit" [disabled]="loading()">
        @if (loading()) {
          <span class="btn-login__spinner"></span>
          Signing in...
        } @else {
          Sign In
          <span class="btn-login__arrow">→</span>
        }
      </button>

    </form>

    <p class="login-card__footer">
      EliteNest Admin Panel &copy; {{ year }}
    </p>

  </div>
</div>
