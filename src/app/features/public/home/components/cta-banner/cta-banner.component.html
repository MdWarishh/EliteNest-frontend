<!-- cta-banner.component.html -->
<section class="cta-banner" #ctaSection>
  <div class="cta-banner__bg"></div>
  <div class="cta-banner__content container">
    <p class="cta-banner__eyebrow" #eyebrow>✦ Ready to Transform Your Space?</p>
    <h2 class="cta-banner__title" #title>
      Let's Create Something <em>Beautiful</em> Together
    </h2>
    <p class="cta-banner__sub" #sub>
      Schedule a free consultation with our expert designers and take the
      first step towards your dream space.
    </p>
    <div class="cta-banner__actions" #actions>
      <a class="btn-gold" routerLink="/contact">
        Book Free Consultation <span class="arrow">→</span>
      </a>
      <a class="btn-outline btn-outline--white" routerLink="/portfolio">
        View Portfolio
      </a>
    </div>
  </div>
</section>
